<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto Gym - Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="home.html" class="logo">Connecto<span>Gym</span></a>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
    <nav id="mainNav">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="plans.html">Plans</a></li>
        <li><a href="coaches.html">Coaches</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li id="guestButtons"><a href="login.html" class="btn-nav">Login</a></li>
        <li class="dropdown hidden" id="userMenu">
          <button class="dropdown-btn" id="userMenuButton">My Account</button>
          <div class="dropdown-content">
            <a href="dashboard.html">My Dashboard</a>
            <a href="dashboard.html#bookings">My Bookings</a>
            <a href="dashboard.html#profile">My Profile</a>
            <a href="#" id="logoutLink">Log Out</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Create Your Account</h2>
      <div class="form-group">
        <label for="nameInput">Full Name</label>
        <input type="text" id="nameInput" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label for="confirmInput">Confirm Password</label>
        <input type="password" id="confirmInput" placeholder="Type the password again">
      </div>
      <button class="btn" id="registerButton">Create Account</button>
      <p class="message" id="messageText"></p>
      <p class="form-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Connecto Gym. All rights reserved.</p>
  </footer>

  <script src="common.js"></script>
  <script src="register.js"></script>
</body>
</html>
