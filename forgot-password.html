<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecto Gym - Forgot Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="home.html" class="logo">Connecto<span>Gym</span></a>
    <button class="menu-toggle" id="menuToggle">&#9776;</button>
    <nav id="mainNav">
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="plans.html">Plans</a></li>
        <li><a href="coaches.html">Coaches</a></li>
        <li><a href="offers.html">Offers</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li id="guestButtons"><a href="login.html" class="btn-nav">Login</a></li>
        <li class="dropdown hidden" id="userMenu">
          <button class="dropdown-btn" id="userMenuButton">My Account</button>
          <div class="dropdown-content">
            <a href="dashboard.html">My Dashboard</a>
            <a href="dashboard.html#bookings">My Bookings</a>
            <a href="dashboard.html#profile">My Profile</a>
            <a href="#" id="logoutLink">Log Out</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Reset Your Password</h2>

      <div id="emailStep">
        <p class="page-intro">Type your email and we will give you a reset code.</p>
        <div class="form-group">
          <label for="emailInput">Email Address</label>
          <input type="email" id="emailInput" placeholder="you@example.com">
        </div>
        <button class="btn" id="getCodeButton">Get Reset Code</button>
      </div>

      <div id="resetStep" class="hidden">
        <p class="message message-success" id="codeBox"></p>
        <div class="form-group">
          <label for="codeInput">Reset Code</label>
          <input type="text" id="codeInput" placeholder="6 digit code">
        </div>
        <div class="form-group">
          <label for="newPasswordInput">New Password</label>
          <input type="password" id="newPasswordInput" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPasswordInput">Confirm New Password</label>
          <input type="password" id="confirmPasswordInput" placeholder="Type the password again">
        </div>
        <button class="btn" id="resetButton">Reset Password</button>
      </div>

      <p class="message" id="messageText"></p>
      <p class="form-link"><a href="login.html">Back to login</a></p>
    </div>
  </main>
  <footer>
    <p>&copy; 2026 Connecto Gym. All rights reserved.</p>
  </footer>

  <script src="common.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
